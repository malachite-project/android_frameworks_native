name: ProducerListener ABI contract

on:
  push:
    branches: [cmdr-chara/miuicamera-port-20260910]
  pull_request:
    branches: [lineage-24.0]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Reject whitespace errors
        run: git diff --check HEAD^ HEAD
      - name: Verify the restored vendor ABI symbol
        run: |
          python3 - <<'PY'
          from pathlib import Path

          header = Path("libs/gui/include/gui/IProducerListener.h").read_text()
          source = Path("libs/gui/IProducerListener.cpp").read_text()
          symbol = '__asm__("_ZN7android18BnProducerListener16onBufferDetachedEi");'
          # ProducerListener::onBufferDetached takes (int, uint64_t) since
          # lineage-24.0; a BnProducerListener member with the old signature
          # would hide it, so the old symbol is exported from a free function.
          assert source.count(symbol) == 1, "missing or duplicate out-of-line ABI symbol"
          assert "virtual void onBufferDetached(int slot);" not in header, "shim member hides the new overload"
          PY
